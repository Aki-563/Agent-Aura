[package]
name = "agent-aura"
version = "0.1.0"
description = "Agent Aura - Ultra-fast, human-like desktop computer-use agent"
authors = ["Agent Aura Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "agent_aura_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "dynamic-acl", "custom-protocol"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
image = "0.25"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1.8"
rightkit-ocr = { version = "0.2.3", default-features = false, features = ["native"] }
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "process", "pattern"] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Variant"
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility"
] }



